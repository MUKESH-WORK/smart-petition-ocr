services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gdp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gdp_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gdp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gdp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gdp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-gdp_db}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      DATALAB_API_KEY: ${DATALAB_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-gdp_production_secret_key_2026}
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:80,http://127.0.0.1:5174"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./uploads:/app/uploads
      - ./temp_cache:/app/temp_cache

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gdp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5174}:80"

volumes:
  gdp_pgdata:
    driver: local
