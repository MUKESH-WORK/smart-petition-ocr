# ==============================================================================
# GDP Assistant – Docker Compose (Production)
# ==============================================================================
# Only 2 services:
#   1. postgres  – pgvector/pgvector:pg16 (external database)
#   2. gdp-assistant – All-in-one image (React + Nginx + FastAPI + Worker + Redis)
# ==============================================================================

services:

  # ==========================================================
  # PostgreSQL 16 + pgvector
  # ==========================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gdp_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - gdp_network


  # ==========================================================
  # GDP Assistant – All-In-One Image
  # React + Nginx + FastAPI + Worker + Redis (internal)
  # ==========================================================
  gdp-assistant:
    image: gdp-assistant:latest
    container_name: gdp_assistant
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-80}:80"

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - document_storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - gdp_network


# ==========================================================
# Isolated Internal Docker Network
# ==========================================================
networks:
  gdp_network:
    driver: bridge


# ==========================================================
# Persistent Data Volumes
# ==========================================================
volumes:
  postgres_data:
  document_storage:
