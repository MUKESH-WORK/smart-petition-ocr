# ==============================================================================
# GDP Assistant – Docker Compose (Production Single-PC / Server Deployment)
# ==============================================================================
# Only 2 services:
#   1. postgres      – pgvector/pgvector:pg16 (Dedicated relational vector database)
#   2. gdp-assistant – All-in-One Container (React 19 + Nginx + FastAPI + Worker + Redis)
# ==============================================================================

services:

  # ============================================================================
  # 1. PostgreSQL 16 + pgvector Database
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gdp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dro_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dro_grievance_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dro_user} -d ${POSTGRES_DB:-dro_grievance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gdp_network
    # Port 5432 is NOT exposed to host; accessible inside gdp_network as postgres:5432

  # ============================================================================
  # 2. GDP Assistant – All-in-One Application Image
  # ============================================================================
  gdp-assistant:
    image: gdp-assistant:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gdp_assistant
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      # Ollama runs on the Windows host; localhost inside this container is
      # the assistant container itself.
      LLM_API_BASE_URL: http://host.docker.internal:11434/v1
      # Persist source documents and their rendered page previews in the
      # existing named volume so history/viewer routes survive container rebuilds.
      UPLOAD_DIR: /app/storage/uploads
      STATIC_MEDIA_DIR: /app/storage/static/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - document_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gdp_network

# ==============================================================================
# Dedicated Internal Bridge Network+
# ==============================================================================
networks:
  gdp_network:
    driver: bridge

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
  document_storage:
