# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: gdp-assistant
metadata:
  template: gdp-assistant-app@1.0.0

infra:
  provider: bicep
  path: ./infra

azure:
  location: eastus2

services:
  backend:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./backend/Dockerfile
      context: .

  frontend:
    project: ./frontend
    language: ts
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ./frontend
